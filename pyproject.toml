[project]
name = "valid-latent-thoughts"
version = "1.0.0"
description = "Code for 'What Makes a Latent Thought Valid? Defining and Auditing Thought Representations in LLMs'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=4.57.3,<5.0.0",
    "hydra-core>=1.3.2",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "dotenv>=0.9.9",
    "rich>=14.2.0",
    "accelerate>=1.11.0",
    "scikit-learn>=1.8.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "kernels>=0.12.3",
    "torch==2.10.0+cu126",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
